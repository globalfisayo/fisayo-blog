name: Deploy blog + opportunity universe to fisayo.org

on:
  push:
    branches: [main]
    # Skip deploys for commits that only touch the Joy Agent's operational
    # data (run logs, review queues, state) — the site only changes when
    # src/, public/, or the build setup changes. Opportunity publishes DO
    # touch src/data/opportunities/, so they deploy.
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'joy.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vite.joy.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  # Lets other workflows (joy-review-ingest.yml) trigger a deploy after they
  # commit newly approved opportunities to main.
  workflow_call:

# Never let two deploys interleave their upload/swap steps.
concurrency:
  group: deploy-blog
  cancel-in-progress: true

env:
  # The blog is served from https://fisayo.org/blog/ — assets live under /blog/.
  VITE_BASE: /blog/
  # The Opportunity Universe is served from https://fisayo.org/joy/.
  VITE_JOY_BASE: /joy/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Always deploy the latest main — when called from joy-review-ingest,
      # the triggering SHA predates the commit that ingest just pushed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:joy

      - name: Deploy to Hostinger over SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          tar -czf blog.tar.gz -C dist .
          tar -czf joy.tar.gz -C dist-joy .

          scp -P 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            blog.tar.gz u639443301@82.29.189.52:~/blog-deploy.tar.gz
          scp -P 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            joy.tar.gz u639443301@82.29.189.52:~/joy-deploy.tar.gz

          # Unpack each app to a staging dir, then swap it in — visitors never
          # see a half-written /blog/ or /joy/ directory.
          ssh -p 65002 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            u639443301@82.29.189.52 '
              set -e
              cd ~/domains/fisayo.org/public_html

              rm -rf blog.new
              mkdir blog.new
              tar -xzf ~/blog-deploy.tar.gz -C blog.new
              rm -rf blog.old
              if [ -d blog ]; then mv blog blog.old; fi
              mv blog.new blog
              rm -rf blog.old ~/blog-deploy.tar.gz

              rm -rf joy.new
              mkdir joy.new
              tar -xzf ~/joy-deploy.tar.gz -C joy.new
              rm -rf joy.old
              if [ -d joy ]; then mv joy joy.old; fi
              mv joy.new joy
              rm -rf joy.old ~/joy-deploy.tar.gz

              # The old Notion-backed Opportunities page is retired: a
              # physical /opportunities/ directory (which takes precedence
              # over the WordPress page, same as /blog/ and /joy/) 301s
              # every visitor and inbound link to the new universe. Remove
              # this block and the directory to hand the URL back to
              # WordPress.
              mkdir -p opportunities
              printf "RewriteEngine On\nRewriteRule ^ https://fisayo.org/joy/ [R=301,L]\n" > opportunities/.htaccess

              # The WordPress nav dropdown ("Latest Insights") is rendered from
              # blog/posts-index.json by a mu-plugin, and WordPress pages are
              # cached by LiteSpeed for up to 7 days. Without this purge the
              # main site keeps showing stale content after a deploy.
              cd ~/domains/fisayo.org/public_html
              wp litespeed-purge all || echo "cache purge failed, continuing"
            '
